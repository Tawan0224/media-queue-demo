services:
  rabbitmq:
    image: rabbitmq:3-management
    hostname: rabbitmq            # fixed hostname so stored queues survive restarts
    ports:
      - "5672:5672"               # AMQP (apps connect here)
      - "15672:15672"             # Management dashboard (browser)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: media
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d media"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://app:app@postgres:5432/media
    volumes:
      - media_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./worker
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      DATABASE_URL: postgresql://app:app@postgres:5432/media
      MAX_RETRIES: "3"
      SLOW_MODE_SECONDS: "15"     # artificial delay so the class can watch; set to 0 to disable
    volumes:
      - media_data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  rabbitmq_data:
  pg_data:
  media_data:
